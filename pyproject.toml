[project]
name = "rheed2morph"
version = "0.1.0"
description = "Research pipeline for RHEED-to-AFM morphology prediction."
requires-python = ">=3.12"
dependencies = [
    "gwyfile>=0.2.0",
    "imageio>=2.37.0",
    "imageio-ffmpeg>=0.6.0",
    "joblib>=1.5.0",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "PySide6>=6.7.0",
    "pyspm>=0.6.0",
    "tifffile>=2025.5.10",
    "torch",
]

[project.scripts]
rheed2morph-inspect-afm = "rheed2morph.afm.inspect:main"
rheed2morph-extract-afm = "rheed2morph.afm.batch_extract:main"
rheed2morph-make-pairs = "rheed2morph.pairing.make_pairs:main"
rheed2morph-build-one-to-one-manifests = "rheed2morph.manifests.one_to_one:main"
rheed2morph-rheed-descriptor-mvp = "rheed2morph.rheed.mvp:main"
rheed2morph-run-pipeline = "rheed2morph.pipeline.run:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests/benchmark_v1"]
norecursedirs = [
    "paper_freeze",
    "publication_freeze",
    "data",
    "outputs",
    "reports",
    ".venv",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
