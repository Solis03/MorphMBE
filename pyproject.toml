[project]
name = "morphmbe"
version = "1.0.0"
description = "RHEED-to-AFM surface morphology prediction with MorphMBE M22."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "imageio>=2.37.0",
    "imageio-ffmpeg>=0.6.0",
    "joblib>=1.5.0",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "pillow>=11.0.0",
    "PySide6>=6.7.0",
    "scikit-image>=0.25.0",
    "scikit-learn>=1.6.0",
    "scipy>=1.15.0",
    "torch",
    "torchvision==0.27.0",
    "transformers>=4.50,<5",
]

[project.scripts]
morphmbe-predict = "rheed2morph.realtime.predict:main"
morphmbe-ui = "rheed2morph.realtime.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["analysis*", "rheed2morph*"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = ["E501"]
