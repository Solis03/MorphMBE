{
  "random_seed": 20260712,
  "repo_root": ".",
  "outputs_dir": "outputs/rheed_roughness",
  "reports_dir": "reports/rheed_roughness",
  "manifests": {
    "candidate_table": "data/manifests/afm_candidate_table_complete.csv",
    "representative_one_to_one": "data/manifests/manifest_all_size_representative_one_to_one.csv",
    "primary_one_to_one": "data/manifests/manifest_1um_one_to_one.csv"
  },
  "data_roots": {
    "pair_root": "data/pair",
    "processed_afm_root": "data/processed_afm",
    "plane_corrected_afm_root": "data/plane_corrected_afm",
    "crop_video_root": "data/rheed_roi_shadow_right_v2_main_raw_crop_videos_256"
  },
  "rheed": {
    "input": "crop_video",
    "image_size": 256,
    "primary_window_fraction": 0.10,
    "max_primary_frames_per_video": 32,
    "smoke_frames_per_video": 8,
    "epsilon": 1e-08,
    "morphology_score_definition": {
      "spottiness": "round_spot_count + 0.6 * elongated_spot_count + 0.25 * diffuse_blob_count",
      "streakiness": "horizontal_bar_count + vertical_streak_count + 0.6 * elongated_spot_count + bar_like_score * max(total_component_count, 1)",
      "morphology_index": "spottiness / (spottiness + streakiness + epsilon)"
    }
  },
  "afm": {
    "height_unit_default": "nm",
    "primary_scan_size_um": 1.0,
    "primary_scan_size_tolerance_um": 0.10,
    "prefer_plane_corrected": true
  },
  "qc": {
    "min_valid_frames": 8,
    "min_valid_fraction": 0.50,
    "max_median_saturation_fraction": 0.10,
    "max_median_underexposed_fraction": 0.45,
    "min_median_dynamic_range": 0.045,
    "min_median_detector_confidence": 0.15,
    "max_unknown_height_unit_fraction": 0.0
  },
  "statistics": {
    "bootstrap_resamples": 10000,
    "permutation_resamples": 10000,
    "smoke_resamples": 500,
    "min_stratum_samples": 3
  },
  "perturbations": {
    "max_frames": 96,
    "brightness_scales": [0.5, 0.75, 1.25, 1.75],
    "contrast_scales": [0.5, 1.5],
    "gammas": [0.6, 1.8],
    "translations_px": [-8, 8],
    "rotations_deg": [-5, -2, 2, 5],
    "blur_sigmas": [1.0, 2.0],
    "noise_sigmas": [0.02, 0.05],
    "saturation_levels": [0.85, 0.95]
  },
  "human_review": {
    "target_frames": 120,
    "frames_per_sample": 3
  }
}

